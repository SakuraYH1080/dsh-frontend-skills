<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dust · 纯 CSS 尘埃（零 JS）</title>
<style>
  :root {
    --ink: #0b0e14;
    --paper: #eef3fb;
    --dot: #cfe3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- 粒子场：60 个独立合成层，指针永不拦截 ---- */
  .p-field {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
    contain: strict;
  }
  .p-dot {
    position: absolute;
    width: var(--s, 2px);
    height: var(--s, 2px);
    border-radius: 50%;
    background: var(--dot);
    opacity: 0;
    will-change: transform, opacity;
    animation: drift var(--d, 16s) linear var(--delay, 0s) infinite;
  }
  /* 12% 起亮、85% 起灭：两端各有 12% / 15% 的过渡窗，避免硬切 */
  @keyframes drift {
    0%   { transform: translate3d(0, 0, 0); opacity: 0; }
    12%  { opacity: var(--a, .18); }
    85%  { opacity: var(--a, .18); }
    100% { transform: translate3d(var(--dx, 36px), -140px, 0); opacity: 0; }
  }

  /* ---- 正文遮罩：粒子在最亮处也只到 0.18 ---- */
  .mask {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background: linear-gradient(180deg, rgba(11,14,20,0.18), rgba(11,14,20,0.62) 78%);
  }
  main {
    position: relative;
    z-index: 2;
    max-width: 720px;
    margin: 0 auto;
    padding: 12vh 28px 16vh;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: #7f96b4;
    margin: 0 0 18px;
  }
  h1 {
    font-size: clamp(34px, 5.6vw, 56px);
    line-height: 1.1;
    letter-spacing: -.02em;
    margin: 0 0 24px;
    font-weight: 600;
  }
  p {
    font-size: 16px;
    line-height: 1.75;
    color: #b9c7dc;
    margin: 0 0 18px;
  }
  .spec {
    margin-top: 36px;
    border-top: 1px solid rgba(207,227,255,.16);
    padding-top: 18px;
    font-size: 13px;
    line-height: 1.9;
    color: #8ea3bd;
    font-variant-numeric: tabular-nums;
  }
  .spec b { color: #cfe3ff; font-weight: 600; }

  /* ---- 降级：静态帧只留 40 颗，密度不塌 ---- */
  @media (prefers-reduced-motion: reduce) {
    .p-dot { animation: none; opacity: var(--a, .18); transform: none; }
    .p-dot:nth-child(n+41) { display: none; }
  }
  @media (pointer: coarse) {
    .p-field { opacity: .8; }
    .p-dot { animation-duration: calc(var(--d, 16s) * 1.25); }
  }
  @media (max-width: 520px) {
    main { padding: 10vh 20px 14vh; }
    .p-dot:nth-child(n+41) { display: none; }
  }
</style>
</head>

<main>
  <p class="eyebrow">frontend-particles · 02</p>
  <h1>尘埃：零 JS，60 粒</h1>
  <p>
    每个粒子是一个独立合成层，成本来自层数而不是像素。超过 80 层，Safari 与 Chrome 的
    raster 时间开始抖；60 是安全值。
  </p>
  <p>
    每粒的尺寸、时长、水平位移、延迟都不同。延迟取负值，动画一开始就分布在中段，
    避免首屏齐发。
  </p>
  <div class="spec">
    粒子数 <b>60</b> · 时长 <b>12–24s</b> · 尺寸 <b>1–2.6px</b> ·
    峰值 alpha <b>0.10–0.18</b> · 正文叠合对比度 <b>≥ 4.5:1</b>
  </div>
</main>
