<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>启动器 · B 模型（角色穿透界面）</title>
<link rel="stylesheet" href="../assets/anime.css">
<style>
  /* B 模型专属：两片立绘必须共用同一组 --af-* 变量，任何魔法数字都会让缩放时脱开 */
  .af-stage { display: grid; place-items: center; }
  .af-char--split .af-char__back,
  .af-char--split .af-char__front { mask-image: none; -webkit-mask-image: none; }
  .af-char--split .af-char__front { z-index: 24; }
  .af-launch { position: absolute; left: 50%; top: 50%; z-index: 20; transform: translate(-50%, -50%); width: min(520px, calc(100% - 48px)); text-align: center; }
  .af-launch .af-body { max-width: 40ch; margin-left: auto; margin-right: auto; }
  .af-meta { position: absolute; left: 24px; right: 24px; bottom: 20px; z-index: 20; display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .5; }
  .af-cutline { position: absolute; left: 0; right: 0; top: calc(46% * 1); z-index: 21; height: 1px; background: linear-gradient(90deg, transparent, rgba(16,18,26,.28), transparent); pointer-events: none; }
  @media (max-width: 640px) {
    .af-launch { position: relative; left: auto; top: auto; transform: none; margin: 24px auto 0; }
    .af-cutline { display: none; }
    .af-meta { position: relative; left: auto; right: auto; bottom: auto; margin: 20px 16px 24px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <linearGradient id="af-pl-hair" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2B2440"/><stop offset="0.55" stop-color="#4B3E6B"/><stop offset="1" stop-color="#6B5A8F"/>
    </linearGradient>
    <linearGradient id="af-pl-coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B3456"/><stop offset="1" stop-color="#1A1728"/>
    </linearGradient>
    <linearGradient id="af-pl-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6DFD2"/><stop offset="1" stop-color="#E8C6B4"/>
    </linearGradient>
  </defs>
</svg>
<main class="af-stage af-preset-launcher af-anim">
  <div class="af-l0" aria-hidden="true"></div>

  <!-- L1 角色：同一张图切两片。后片 z=0 被面板盖住，前片 z=24 盖住面板 -->
  <div class="af-char af-char--split">
    <svg class="af-char__back" viewBox="0 0 400 600" preserveAspectRatio="xMidYMin meet" role="img" aria-label="角色立绘占位，生产环境替换为正式素材">
      <!-- 后发 -->
      <path d="M200 60c-58 0-102 44-104 104-1 34 6 62 14 92 6 22 8 40 4 54h-38c10-26 12-52 6-84-8-44-16-84-8-124 12-62 62-102 126-102z" fill="url(#af-pl-hair)" opacity=".92"/>
      <!-- 身体 -->
      <path d="M200 250c56 0 96 22 108 62l26 92c6 22 2 34-14 40l-40 14v102H120V458l-40-14c-16-6-20-18-14-40l26-92c12-40 52-62 108-62z" fill="url(#af-pl-coat)"/>
      <!-- 领口 -->
      <path d="M200 250l-34 30 34 44 34-44z" fill="#F7F1F6" opacity=".85"/>
      <!-- 颈 -->
      <path d="M180 214h40v42c0 8-40 8-40 0z" fill="#E8C6B4"/>
      <!-- 脸 -->
      <path d="M200 96c46 0 74 34 74 82 0 56-32 96-74 96s-74-40-74-96c0-48 28-82 74-82z" fill="url(#af-pl-skin)"/>
      <!-- 前发 -->
      <path d="M200 74c54 0 92 34 96 82 2 22-4 36-10 44-4-30-12-48-26-58-10-8-22-6-30 6-10 14-16 20-30 20-16 0-24-12-32-26-6-10-14-14-24-8-14 8-20 26-24 50-8-10-12-24-10-44 4-48 42-66 90-66z" fill="url(#af-pl-hair)"/>
      <!-- 眼 -->
      <ellipse cx="170" cy="188" rx="9" ry="12" fill="#2A2440"/>
      <ellipse cx="230" cy="188" rx="9" ry="12" fill="#2A2440"/>
      <circle cx="173" cy="184" r="3" fill="#FFF"/>
      <circle cx="233" cy="184" r="3" fill="#FFF"/>
      <!-- 帽饰 / 发带：给角色一个可指认的识别点 -->
      <rect x="232" y="120" width="46" height="12" rx="6" fill="#FF5C8A" opacity=".9" transform="rotate(-18 232 120)"/>
    </svg>
    <svg class="af-char__front" viewBox="0 0 400 600" preserveAspectRatio="xMidYMin meet" role="img" aria-label="角色立绘占位，生产环境替换为正式素材">
      <!-- 后发 -->
      <path d="M200 60c-58 0-102 44-104 104-1 34 6 62 14 92 6 22 8 40 4 54h-38c10-26 12-52 6-84-8-44-16-84-8-124 12-62 62-102 126-102z" fill="url(#af-pl-hair)" opacity=".92"/>
      <!-- 身体 -->
      <path d="M200 250c56 0 96 22 108 62l26 92c6 22 2 34-14 40l-40 14v102H120V458l-40-14c-16-6-20-18-14-40l26-92c12-40 52-62 108-62z" fill="url(#af-pl-coat)"/>
      <!-- 领口 -->
      <path d="M200 250l-34 30 34 44 34-44z" fill="#F7F1F6" opacity=".85"/>
      <!-- 颈 -->
      <path d="M180 214h40v42c0 8-40 8-40 0z" fill="#E8C6B4"/>
      <!-- 脸 -->
      <path d="M200 96c46 0 74 34 74 82 0 56-32 96-74 96s-74-40-74-96c0-48 28-82 74-82z" fill="url(#af-pl-skin)"/>
      <!-- 前发 -->
      <path d="M200 74c54 0 92 34 96 82 2 22-4 36-10 44-4-30-12-48-26-58-10-8-22-6-30 6-10 14-16 20-30 20-16 0-24-12-32-26-6-10-14-14-24-8-14 8-20 26-24 50-8-10-12-24-10-44 4-48 42-66 90-66z" fill="url(#af-pl-hair)"/>
      <!-- 眼 -->
      <ellipse cx="170" cy="188" rx="9" ry="12" fill="#2A2440"/>
      <ellipse cx="230" cy="188" rx="9" ry="12" fill="#2A2440"/>
      <circle cx="173" cy="184" r="3" fill="#FFF"/>
      <circle cx="233" cy="184" r="3" fill="#FFF"/>
      <!-- 帽饰 / 发带：给角色一个可指认的识别点 -->
      <rect x="232" y="120" width="46" height="12" rx="6" fill="#FF5C8A" opacity=".9" transform="rotate(-18 232 120)"/>
    </svg>
  </div>

  <div class="af-cutline" aria-hidden="true"></div>

  <!-- L2 界面：正好骑在切线上，上半被前片压住，下半压住后片 -->
  <section class="af-launch af-panel">
    <p class="af-sub">Now Loading</p>
    <h1 class="af-title">第七码头</h1>
    <div class="af-scrim">
      <p class="af-body">档案已解封。进入者请确认身份，未登记的信号将被自动忽略。</p>
    </div>
    <div class="af-actions" style="justify-content:center">
      <button class="af-btn af-btn--accent" type="button">开始</button>
      <button class="af-btn af-btn--ghost" type="button">读取存档</button>
    </div>
  </section>

  <div class="af-l3" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <p class="af-meta"><span>Model B / cut 46%</span><span>素材：本 skill 原创占位几何图</span></p>
</main>
<script src="../assets/anime.js"></script>
<script>
  /* 视差 0.85 是 launcher 预设的运行值：B 模型纵深更强，但必须 < 1.0 */
  if (window.AnimeFusion) { window.AnimeFusion.init(".af-stage", { parallax: 0.85 }); }
  /* 按 F 开 / 关头部禁区框。几何与 anime.js 的 forbidCheck 完全一致（0.62 × 0.26、从 --af-headroom 起算），
     所以框里出现面板，就等于 forbidCheck 会报警。 */
  (function () {
    var box = document.createElement("div");
    box.setAttribute("aria-hidden", "true");
    box.style.cssText = "position:fixed;display:none;border:1px dashed #FF5C8A;background:rgba(255,92,138,.14);z-index:9999;pointer-events:none";
    document.body.appendChild(box);
    function draw() {
      var stage = document.querySelector(".af-stage");
      var char = document.querySelector(".af-char");
      if (!stage || !char) return;
      var c = char.getBoundingClientRect();
      var hr = (parseFloat(getComputedStyle(stage).getPropertyValue("--af-headroom")) || 10) / 100;
      var w = c.width * 0.62;
      var h = c.height * 0.26;
      box.style.left = (c.left + c.width * 0.5 - w / 2) + "px";
      box.style.top = (c.top + c.height * hr) + "px";
      box.style.width = w + "px";
      box.style.height = h + "px";
    }
    addEventListener("keydown", function (e) {
      if (e.key !== "f" && e.key !== "F") return;
      var on = box.style.display !== "block";
      box.style.display = on ? "block" : "none";
      if (on) draw();
    });
    addEventListener("resize", function () { if (box.style.display === "block") draw(); });
  })();

</script>
</body>
</html>
